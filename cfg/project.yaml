# Project-wide defaults
data_dir: data
results_dir: experiments/results
plots_dir: experiments/plots

# Experiment defaults
method: smoke_synth
clients: 4
rounds: 3
seed: 42
client_fraction: 1.0

# Tiny local optimization defaults
local_epochs: 1
batch_size: 32
lr: 0.01

# Dataset defaults for fast experiments
dataset:
  name: mnist
  train_samples_cap: 1000
  test_samples_cap: 200

# Data partition defaults
partition:
  type: iid  # iid, dirichlet
  alpha: 0.1

# Plot defaults
plot:
  dpi: 120
  figsize: [6, 4]

# Server aggregation defaults
server:
  aggregator: fedavg  # fedavg, trimmed_mean, multi_krum
  trim_ratio: 0.1
  f: 1
  m: null

# Attack defaults (OFF by default)
attack:
  enabled: false
  type: signflip
  malicious_fraction: 0.0
  scale: 1.0
  seed: 42
  target: update

# Defense defaults (OFF by default)
defense:
  enabled: false
  type: pid_exclusion
  k_exclude: 1
  threshold: 0.5
  integral_decay: 1.0
  Kp: 1.0
  Ki: 0.0
  Kd: 0.0
  warmup_rounds: 0
